# Faixas da matriz de risco usadas como referência para a classificação contábil (CPC 25 / NBC TG 25).
# Provável = mais provável que sim do que não (item 23): provisiona (item 14). Passivo contingente
# não é reconhecido; é divulgado, salvo se remoto (itens 27, 28 e 86). "Possível" não é definido no
# CPC 25 (faixa intermediária por convenção). A classificação final é do contador/auditor.
classificacao_cpc25:
  alta: "Provável — provisionar"
  media: "Possível — divulgar em nota explicativa"
  baixa: "Remota — sem provisão nem divulgação"
