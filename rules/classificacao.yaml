  - tipo: estabilidade_gestante
    palavras: 'gestante|gravidez|gr[áa]vida'
  - tipo: estabilidade_acidentaria
    palavras: 'estabilidade\s+acident|art(?:igo)?\.?\s*118'
  - tipo: adicional_noturno
