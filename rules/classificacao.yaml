  - tipo: diferencas_salariais
    palavras: 'sal[áa]rio\s+(?:suprimido|ajustado|reduzido)|diferen[çc]as?\s+(?:salariais|de\s+sal[áa]rio|do\s+sal[áa]rio)|piso\s+(?:salarial|da\s+categoria)|reajuste'
