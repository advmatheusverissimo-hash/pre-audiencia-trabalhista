    palavras: 'rescis[ãa]o\s+indireta|art(?:igo)?\.?\s*483'
  - tipo: reversao_justa_causa
    palavras: '(?:revers[ãa]o|nulidade|afastamento)\s+d[ae]\s+justa\s+causa|justa\s+causa'
  - tipo: insalubridade
    palavras: 'insalubridade'
  - tipo: periculosidade
    palavras: 'periculosidade'
  - tipo: doenca_ocupacional
